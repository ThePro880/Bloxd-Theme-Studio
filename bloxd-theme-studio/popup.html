<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:340px;background:#181d2c;color:#f1f5f9;font-family:"Segoe UI",sans-serif;font-size:12px;font-weight:700;padding:12px;user-select:none}
header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid #2b334d;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
h1{font-family:"Arial Black",sans-serif;font-weight:900;font-size:20px;line-height:1;color:#fff;text-shadow:-1.5px -1.5px 0 #101422,1.5px -1.5px 0 #101422,-1.5px 1.5px 0 #101422,1.5px 1.5px 0 #101422,0 3px 0 #101422}
h1 span{color:#cbd5e1;font-size:15px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#252d45;border:1px solid #333e5e;padding:2px 8px;font-size:11px;border-radius:2px}
.dot{width:7px;height:7px;background:#22c55e;box-shadow:0 0 6px #22c55e}
.hbtns{display:flex;gap:5px}
section{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #2b334d}
section:last-of-type{border:0;margin:0;padding-bottom:4px}
.hd{display:flex;justify-content:space-between;margin-bottom:7px;font-size:11px;font-weight:800;letter-spacing:.7px;color:#9ba6c7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,a.blu{font-family:inherit;font-weight:800;cursor:pointer;border-radius:3px}
.preset-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:#22293e;border:2px solid #3c476b;padding:7px 4px;color:#fff;font-size:12px}
.preset-btn:hover{background:#2c3552}
.p1{border-color:#dc2626}.p2{border-color:#f97316}.p3{border-color:#38bdf8}
.preset-btn.active{border:2px solid transparent;background:linear-gradient(#26304c,#26304c) padding-box,linear-gradient(90deg,#facc15,#22c55e,#38bdf8,#a855f7,#ec4899) border-box}
.sw{width:22px;height:22px;border-radius:2px;border:2px solid #0f1320}
.inp{display:flex;align-items:center;background:#27304a;border:1.5px solid #445075;border-radius:3px;padding:0 8px;margin-bottom:8px;gap:6px}
.inp:focus-within{border-color:#9b5de5}
#theme-name{width:100%;padding:6px 0;border:0;outline:0;background:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700}
.box{background:#20273b;border:1px solid #354061;border-radius:3px;padding:7px 9px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
label{display:flex;justify-content:space-between;align-items:center;color:#d8e0f5}
input[type=color]{width:34px;height:21px;border:1.5px solid #4d5b85;background:#181d2c;cursor:pointer}
select{background:#2a3350;color:#fff;border:1.5px solid #4d5b85;padding:2px 5px;font-family:inherit;font-size:11px;font-weight:700}
.act{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.gold{background:#21273d;border:2px solid #eab308;color:#facc15;padding:7px;font-size:13px}
.purp{background:#21273d;border:2px solid #8b5cf6;color:#d8b4fe;padding:7px;font-size:13px}
.wht{background:#21273d;border:1.5px solid #cbd5e1;color:#fff;padding:5px 8px;font-size:11px}
.blu{background:#2563eb;border:1.5px solid #60a5fa;color:#fff;padding:5px 9px;font-size:11px;text-decoration:none;display:inline-flex;align-items:center}
.gold:hover{background:#eab30833}.purp:hover{background:#8b5cf638}.wht:hover{background:#2f3854}.blu:hover{background:#3b82f6}
.saved-list{display:flex;flex-direction:column;gap:6px;max-height:110px;overflow-y:auto}
.saved-item{display:flex;justify-content:space-between;align-items:center;background:#242e48;border:1px solid #3c486e;border-radius:3px;padding:5px 8px}
.saved-info{display:flex;align-items:center;gap:8px}
.mini-dot{width:16px;height:16px;border-radius:2px;border:1.5px solid #0f1320}
.saved-btns{display:flex;gap:5px}
.btn-apply{background:#21273d;border:1.5px solid #22c55e;color:#86efac;padding:3px 8px;font-size:11px}
.btn-del{background:#21273d;border:1.5px solid #ef4444;color:#fca5a5;padding:3px 7px;font-size:11px}
.empty-msg{color:#6b7699;text-align:center;padding:7px;background:#1e2438;border:1px dashed #333e5e}
#status{font-size:11px;color:#facc15;text-align:center;min-height:15px}
</style>
</head>
<body>
<header>
  <div>
    <div class="top">
      <svg width="26" height="26" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="2" fill="#232c47" stroke="#60a5fa" stroke-width="2.5"/><rect x="6" y="6" width="10" height="10" fill="#facc15" stroke="#111625" stroke-width="1.5"/><rect x="16" y="6" width="10" height="10" fill="#a855f7" stroke="#111625" stroke-width="1.5"/><rect x="6" y="16" width="10" height="10" fill="#38bdf8" stroke="#111625" stroke-width="1.5"/><rect x="16" y="16" width="10" height="10" fill="#ef4444" stroke="#111625" stroke-width="1.5"/></svg>
      <h1>bloxd<span>.themes</span></h1>
    </div>
    <div class="badge"><span class="dot"></span>Theme Studio v2.0</div>
  </div>
  <div class="hbtns">
    <a id="btn-more" class="blu" href="https://bloxd.io/more_settings" target="_blank" title="Open bloxd.io/more_settings">More</a>
    <button id="btn-reset" class="wht" title="Restore default design">Default</button>
  </div>
</header>

<section>
  <div class="hd"><span>INSTANT THEMES</span><span>3 READY</span></div>
  <div class="grid">
    <button class="preset-btn p1" data-preset="navidad"><span class="sw" style="background:linear-gradient(135deg,#16a34a 50%,#dc2626 50%)"></span>Christmas</button>
    <button class="preset-btn p2" data-preset="halloween"><span class="sw" style="background:linear-gradient(135deg,#581c87 50%,#f97316 50%)"></span>Halloween</button>
    <button class="preset-btn p3" data-preset="verano"><span class="sw" style="background:linear-gradient(135deg,#0284c7 50%,#facc15 50%)"></span>Summer</button>
  </div>
</section>

<section>
  <div class="hd"><span>CREATE THEME</span></div>
  <div class="inp"><span>#</span><input id="theme-name" placeholder="Theme Name" maxlength="24"></div>
  <div class="box">
    <label>Games background<input type="color" id="c-main" value="#1b2236"></label>
    <label>Left sidebar<input type="color" id="c-sidebar" value="#131826"></label>
    <label>Loading screen<input type="color" id="c-loading" value="#161c2e"></label>
    <label>Panels (Profile/Friends)<input type="color" id="c-panel" value="#242c44"></label>
    <label>Accent (Borders &amp; bar)<input type="color" id="c-accent" value="#38bdf8"></label>
    <label>Text color<input type="color" id="c-text" value="#ffffff"></label>
    <label>Animated effect<select id="c-effect"><option value="none">None</option><option value="snow">Snow</option><option value="spooky">Sparks</option><option value="summer">Bubbles</option></select></label>
  </div>
  <div class="act">
    <button id="btn-preview" class="gold">Preview</button>
    <button id="btn-save" class="purp">Save &amp; Apply</button>
  </div>
</section>

<section>
  <div class="hd"><span>SAVED THEMES</span></div>
  <div id="saved-list" class="saved-list"><p class="empty-msg">No saved themes yet.</p></div>
</section>

<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
