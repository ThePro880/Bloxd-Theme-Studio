<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bloxd.io Theme Studio v3.0</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="icon.png" alt="Logo" class="brand-icon">
      <h1>Bloxd Theme Studio</h1>
      <span class="ver-pill">v3.0</span>
    </div>
    <button type="button" id="btn-reset" class="btn-reset" title="Restore Default Bloxd">Reset</button>
  </header>

  <main class="container">
    <section class="card">
      <div class="section-title">Instant Themes</div>
      <div class="preset-grid">
        <button type="button" class="preset-btn" data-preset="navidad">Christmas</button>
        <button type="button" class="preset-btn" data-preset="halloween">Halloween</button>
        <button type="button" class="preset-btn" data-preset="verano">Summer</button>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Custom Theme Creator</div>
      <input type="text" id="theme-name" class="text-inp" placeholder="Theme name (e.g. Cyber Blue)" maxlength="28">

      <div class="color-grid">
        <label class="color-item">
          <span>Main BG</span>
          <input type="color" id="c-main" value="#1b2236">
        </label>
        <label class="color-item">
          <span>Sidebar</span>
          <input type="color" id="c-sidebar" value="#131826">
        </label>
        <label class="color-item">
          <span>Loading</span>
          <input type="color" id="c-loading" value="#161c2e">
        </label>
        <label class="color-item">
          <span>Panels</span>
          <input type="color" id="c-panel" value="#242c44">
        </label>
        <label class="color-item">
          <span>Accent</span>
          <input type="color" id="c-accent" value="#38bdf8">
        </label>
        <label class="color-item">
          <span>Text</span>
          <input type="color" id="c-text" value="#ffffff">
        </label>
      </div>

      <div class="effect-row">
        <label for="c-effect">Particles</label>
        <select id="c-effect" class="select-inp">
          <option value="none">None</option>
          <option value="snow">Snow</option>
          <option value="spooky">Sparks / Spooky</option>
          <option value="summer">Summer Bubbles</option>
        </select>
      </div>

      <div class="action-row">
        <button type="button" id="btn-preview" class="btn-grey">Preview</button>
        <button type="button" id="btn-save" class="btn-blue">Save &amp; Apply</button>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Saved Themes</div>
      <div id="saved-list" class="saved-list"></div>
    </section>

    <a id="btn-more" class="btn-more" href="https://bloxd.io/more_settings" target="_blank">
      More Settings (PvP HUD, GIF BG &amp; Music)
    </a>

    <div id="status" class="status"></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
